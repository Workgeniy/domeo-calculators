<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Передача проекта в комплектацию</title>
<style>
  :root {
    --page: #F2F2F1;
    --sheet: #FFFFFF;
    --ink: #1A1A1A;
    --ink-2: #55555A;
    --ink-3: #8A8A90;
    --line: #DCDCDA;
    --line-strong: #B8B8B4;
    --rule: #1A1A1A;
    --field: #FFFFFF;
    --focus: #4A6FA5;
    --focus-soft: rgba(74, 111, 165, 0.16);
    --sans: "Segoe UI", Tahoma, Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #17181A;
      --sheet: #1E2023;
      --ink: #E9E9EA;
      --ink-2: #A8A8AE;
      --ink-3: #7C7C84;
      --line: #33353A;
      --line-strong: #4A4D53;
      --rule: #E9E9EA;
      --field: #232629;
      --focus: #7FA5DC;
      --focus-soft: rgba(127, 165, 220, 0.22);
    }
  }

  :root[data-theme="dark"] {
    --page: #17181A;
    --sheet: #1E2023;
    --ink: #E9E9EA;
    --ink-2: #A8A8AE;
    --ink-3: #7C7C84;
    --line: #33353A;
    --line-strong: #4A4D53;
    --rule: #E9E9EA;
    --field: #232629;
    --focus: #7FA5DC;
    --focus-soft: rgba(127, 165, 220, 0.22);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 16px 56px; }

  .sheet {
    background: var(--sheet);
    border: 1px solid var(--line);
    padding: 34px 40px 30px;
  }

  @media (max-width: 640px) { .sheet { padding: 20px 18px; } }

  /* ---------- шапка бланка ---------- */
  .masthead { border-bottom: 2px solid var(--rule); padding-bottom: 14px; margin-bottom: 4px; }

  h1 { margin: 0 0 6px; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }

  .lede { margin: 0; color: var(--ink-2); font-size: 13px; max-width: 62ch; }

  /* ---------- раздел ---------- */
  .section { padding-top: 22px; }

  .section > h2 {
    margin: 0 0 14px;
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--ink-2);
    border-bottom: 1px solid var(--line-strong);
    padding-bottom: 6px;
  }

  .fields { display: flex; flex-direction: column; gap: 14px; }

  /* ---------- поле ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  .field > label, .field > .glabel { font-size: 13px; font-weight: 600; color: var(--ink); }
  .field .hint { font-weight: 400; color: var(--ink-3); }

  input[type="text"], textarea {
    width: 100%; padding: 7px 10px;
    background: var(--field); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: 3px;
    font-family: inherit; font-size: 14px;
  }

  input.short { max-width: 220px; }

  textarea { min-height: 68px; resize: vertical; line-height: 1.45; }

  input[type="text"]::placeholder, textarea::placeholder { color: var(--ink-3); }

  input[type="text"]:focus, textarea:focus {
    outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px var(--focus-soft);
  }

  /* ---------- варианты ---------- */
  .options { display: flex; flex-wrap: wrap; gap: 6px 22px; padding-top: 2px; }

  .opt {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 2px 0; border: none; background: none;
    font-family: inherit; font-size: 14px; color: var(--ink);
    cursor: pointer; text-align: left;
  }

  .opt:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .opt:hover .mark { border-color: var(--ink); }

  /* Квадрат — можно отметить несколько, круг — только один. */
  .mark {
    width: 14px; height: 14px; flex: none;
    border: 1px solid var(--line-strong); background: var(--field);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; line-height: 1; color: transparent;
  }

  .mark.box { border-radius: 2px; }
  .mark.dot { border-radius: 50%; }

  /* Отметка как на бумажном бланке: поле остаётся светлым, метка тёмная. */
  .opt[aria-pressed="true"] { font-weight: 600; }
  .opt[aria-pressed="true"] .mark { border-color: var(--ink); color: var(--ink); }
  .opt[aria-pressed="true"] .mark.dot { font-size: 13px; }

  .other-note { margin-top: 6px; }

  /* ---------- низ ---------- */
  .actions { padding-top: 26px; margin-top: 22px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

  .btn {
    padding: 8px 18px; border-radius: 3px; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 600;
    border: 1px solid var(--ink); background: var(--ink); color: var(--sheet);
  }

  .btn:hover { opacity: 0.88; }
  .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .btn[disabled] { opacity: 0.5; cursor: progress; }

  .foot { color: var(--ink-3); font-size: 12px; margin: 0; }

  /* ---------- печать ---------- */
  @media print {
    @page { size: A4; margin: 12mm; }

    body { background: #FFFFFF; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    /* Держим экранную ширину и ужимаем целиком, чтобы вёрстка не перестраивалась. */
    .wrap { width: 820px; max-width: none; padding: 0; zoom: 0.84; }
    .sheet { border: none; padding: 0; }

    .actions { display: none !important; }
    .section, .field { break-inside: avoid; page-break-inside: avoid; }
    .section > h2 { break-after: avoid; page-break-after: avoid; }
    textarea { min-height: 0; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="sheet">
    <header class="masthead">
      <h1 id="title">Передача проекта в комплектацию</h1>
      <p class="lede" id="lede"></p>
    </header>

    <div id="form"></div>

    <div class="actions">
      <button type="button" class="btn" id="btn-pdf">Скачать PDF</button>
      <p class="foot" id="foot"></p>
    </div>
  </div>
</div>

<script>
let schema = null;
const state = {};

// ---------- сборка формы из описания ----------
function fieldNode(field) {
  const wrap = document.createElement("div");
  wrap.className = "field";

  const hint = field.hint ? " <span class='hint'>— " + field.hint + "</span>" : "";

  if (field.type === "text" || field.type === "textarea") {
    const id = "f-" + field.id;
    const label = document.createElement("label");
    label.setAttribute("for", id);
    label.innerHTML = field.label + hint;
    wrap.appendChild(label);

    const input = document.createElement(field.type === "textarea" ? "textarea" : "input");
    if (field.type === "text") {
      input.type = "text";
      if (field.short) input.className = "short";
    }
    input.id = id;
    input.value = state[field.id] || "";
    input.addEventListener("input", function () {
      state[field.id] = input.value;
      if (field.type === "textarea") grow(input);
    });
    wrap.appendChild(input);
    if (field.type === "textarea") requestAnimationFrame(function () { grow(input); });
    return wrap;
  }

  const legend = document.createElement("span");
  legend.className = "glabel";
  legend.innerHTML = field.label + hint;
  wrap.appendChild(legend);

  const options = document.createElement("div");
  options.className = "options";
  options.setAttribute("role", "group");
  options.setAttribute("aria-label", field.label);

  const multi = field.type === "multi";
  const list = field.other ? field.options.concat(["другой вариант"]) : field.options;

  for (const option of list) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "opt";
    button.setAttribute("aria-pressed", String(isPicked(field, option)));

    const mark = document.createElement("span");
    mark.className = "mark " + (multi ? "box" : "dot");
    mark.textContent = multi ? "✓" : "●";
    button.appendChild(mark);
    button.appendChild(document.createTextNode(option));

    button.addEventListener("click", function () {
      pick(field, option);
      render();
    });

    options.appendChild(button);
  }

  wrap.appendChild(options);

  // «Другой вариант» без поля для текста бесполезен — открываем строку.
  if (field.other && isPicked(field, "другой вариант")) {
    const note = document.createElement("input");
    note.type = "text";
    note.className = "other-note";
    note.placeholder = "Что именно";
    note.value = state[field.id + "Other"] || "";
    note.addEventListener("input", function () { state[field.id + "Other"] = note.value; });
    wrap.appendChild(note);
  }

  return wrap;
}

function isPicked(field, option) {
  const value = state[field.id];
  if (field.type === "multi") return Array.isArray(value) && value.indexOf(option) !== -1;
  return value === option;
}

function pick(field, option) {
  if (field.type !== "multi") {
    state[field.id] = state[field.id] === option ? null : option;   // повторный клик снимает выбор
    return;
  }

  const current = Array.isArray(state[field.id]) ? state[field.id].slice() : [];
  const at = current.indexOf(option);
  if (at === -1) current.push(option);
  else current.splice(at, 1);
  state[field.id] = current;
}

function grow(textarea) {
  textarea.style.height = "auto";
  textarea.style.height = textarea.scrollHeight + 2 + "px";
}

function render() {
  const host = document.getElementById("form");
  const focused = document.activeElement ? document.activeElement.id : null;
  host.innerHTML = "";

  for (const section of schema.sections) {
    const block = document.createElement("section");
    block.className = "section";

    const heading = document.createElement("h2");
    heading.textContent = section.title;
    block.appendChild(heading);

    const fields = document.createElement("div");
    fields.className = "fields";
    for (const field of section.fields) fields.appendChild(fieldNode(field));
    block.appendChild(fields);

    host.appendChild(block);
  }

  if (focused) {
    const restored = document.getElementById(focused);
    if (restored) restored.focus();
  }
}

// ---------- печать: состояние приходит в адресе ----------
function applyPrintState() {
  const raw = new URLSearchParams(location.search).get("print");
  if (!raw) return;

  try {
    const bytes = Uint8Array.from(atob(raw), function (c) { return c.charCodeAt(0); });
    Object.assign(state, JSON.parse(new TextDecoder().decode(bytes)));
    document.documentElement.setAttribute("data-theme", "light");
  } catch (err) {
    /* битое состояние — печатаем пустой бланк */
  }
}

async function downloadPdf() {
  const button = document.getElementById("btn-pdf");
  const label = button.textContent;
  button.disabled = true;
  button.textContent = "Готовлю файл…";

  try {
    const res = await fetch("api/report/pdf", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);

    const blob = await res.blob();
    const match = (res.headers.get("Content-Disposition") || "").match(/filename=\"?([^\";]+)/);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = match ? match[1] : "peredacha-v-komplektaciyu.pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    button.textContent = "Не получилось: " + err.message;
    setTimeout(function () { button.textContent = label; button.disabled = false; }, 4000);
    return;
  }

  button.textContent = label;
  button.disabled = false;
}

async function boot() {
  try {
    const res = await fetch("form.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    schema = await res.json();
  } catch (err) {
    document.getElementById("form").textContent = "Не удалось загрузить опросник: " + err.message;
    return;
  }

  document.getElementById("lede").textContent = schema.lede;
  document.getElementById("foot").textContent = schema.source;
  document.getElementById("btn-pdf").addEventListener("click", downloadPdf);

  applyPrintState();
  render();
}

boot();
</script>
</body>
</html>
