<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Передача проекта в комплектацию</title>
<style>
  :root {
    --ground: #FFFEF7;
    --card: rgba(255, 255, 255, 0.72);
    --card-solid: #FFFFFF;
    --card-border: rgba(255, 255, 255, 0.75);
    --inner: rgba(255, 255, 255, 0.6);
    --ink: #0A0A0A;
    --ink-2: #52525B;
    --ink-3: #A1A1AA;
    --line: #EFE7CE;
    --line-2: #E4E4E7;
    --yellow: #FACC15;
    --yellow-deep: #EAB308;
    --yellow-pale: #FEF9C3;
    --yellow-line: #FDE047;
    --hero: linear-gradient(135deg, #FDE047 0%, #EAB308 100%);
    --hero-ink: #0A0A0A;
    --shadow: 0 25px 50px -12px rgba(10, 10, 10, 0.13);
    --shadow-sm: 0 4px 14px -6px rgba(10, 10, 10, 0.16);
    --bloom-1: rgba(250, 204, 21, 0.30);
    --bloom-2: rgba(253, 224, 71, 0.24);
    --sans: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0A0A0B;
      --card: rgba(255, 255, 255, 0.055);
      --card-solid: #141416;
      --card-border: rgba(255, 255, 255, 0.10);
      --inner: rgba(255, 255, 255, 0.04);
      --ink: #FAFAFA;
      --ink-2: #A1A1AA;
      --ink-3: #71717A;
      --line: #26262A;
      --line-2: #2C2C31;
      --yellow-pale: rgba(250, 204, 21, 0.14);
      --yellow-line: rgba(250, 204, 21, 0.55);
      --yellow-deep: #FDE047;
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
      --shadow-sm: 0 4px 14px -6px rgba(0, 0, 0, 0.6);
      --bloom-1: rgba(250, 204, 21, 0.13);
      --bloom-2: rgba(253, 224, 71, 0.09);
    }
  }

  :root[data-theme="dark"] {
    --ground: #0A0A0B;
    --card: rgba(255, 255, 255, 0.055);
    --card-solid: #141416;
    --card-border: rgba(255, 255, 255, 0.10);
    --inner: rgba(255, 255, 255, 0.04);
    --ink: #FAFAFA;
    --ink-2: #A1A1AA;
    --ink-3: #71717A;
    --line: #26262A;
    --line-2: #2C2C31;
    --yellow-pale: rgba(250, 204, 21, 0.14);
    --yellow-line: rgba(250, 204, 21, 0.55);
    --yellow-deep: #FDE047;
    --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
    --shadow-sm: 0 4px 14px -6px rgba(0, 0, 0, 0.6);
    --bloom-1: rgba(250, 204, 21, 0.13);
    --bloom-2: rgba(253, 224, 71, 0.09);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1000px 560px at 12% -10%, var(--bloom-1), transparent 62%),
      radial-gradient(820px 480px at 90% 2%, var(--bloom-2), transparent 64%),
      var(--ground);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 20px 72px; display: flex; flex-direction: column; gap: 20px; }

  /* ---------- шапка ---------- */
  .masthead { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 8px 0 4px; }

  h1 {
    margin: 0; font-size: clamp(28px, 4.6vw, 44px); font-weight: 900;
    letter-spacing: -0.03em; line-height: 1.08; text-wrap: balance;
  }

  h1 em { font-style: normal; background: var(--hero); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .lede { margin: 0; max-width: 56ch; color: var(--ink-2); }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 22px; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 700;
    border: 1px solid var(--ink); background: var(--ink); color: var(--ground);
    transition: transform 0.12s, opacity 0.15s;
  }

  .btn:hover { transform: translateY(-1px); }
  .btn:focus-visible { outline: 2px solid var(--yellow-deep); outline-offset: 3px; }
  .btn[disabled] { opacity: 0.55; cursor: progress; transform: none; }

  /* ---------- карточка раздела ---------- */
  .card {
    background: var(--card);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid var(--card-border);
    border-radius: 32px;
    box-shadow: var(--shadow);
    padding: 24px 26px;
  }

  @media (max-width: 640px) { .card { border-radius: 24px; padding: 18px; } }

  .card > h2 {
    margin: 0 0 18px; font-size: 20px; font-weight: 800; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 10px;
  }

  .card > h2 .ic { font-size: 22px; }

  .fields { display: flex; flex-direction: column; gap: 16px; }

  /* ---------- поле ---------- */
  .field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

  .field > label, .field > .glabel {
    font-size: 13.5px; font-weight: 700; color: var(--ink);
  }

  .field .hint { font-weight: 400; color: var(--ink-3); }

  input[type="text"], textarea {
    width: 100%; padding: 11px 15px;
    background: var(--inner); color: var(--ink);
    border: 1px solid var(--line-2); border-radius: 14px;
    font-family: inherit; font-size: 15px; font-weight: 600;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  textarea { min-height: 82px; resize: vertical; font-weight: 400; line-height: 1.5; }

  input[type="text"]::placeholder, textarea::placeholder { color: var(--ink-3); font-weight: 400; }

  input[type="text"]:hover, textarea:hover { border-color: var(--yellow-line); }

  input[type="text"]:focus, textarea:focus {
    outline: none; border-color: var(--yellow); box-shadow: 0 0 0 3px var(--yellow-pale);
  }

  /* ---------- варианты ---------- */
  .options { display: flex; flex-wrap: wrap; gap: 8px; }

  .opt {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 9px 15px 9px 12px;
    background: var(--inner); color: var(--ink-2);
    border: 1px solid var(--line-2); border-radius: 16px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; text-align: left;
    transition: transform 0.12s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }

  .opt:hover { border-color: var(--yellow-line); color: var(--ink); transform: translateY(-1px); }
  .opt:focus-visible { outline: 2px solid var(--yellow-deep); outline-offset: 2px; }

  .opt[aria-pressed="true"] {
    background: var(--yellow-pale); border-color: var(--yellow); color: var(--ink);
    box-shadow: 0 0 0 3px var(--yellow-pale), var(--shadow-sm);
  }

  /* Клетка и точка — чтобы на бумаге было видно, что множественный выбор, а что один. */
  .mark {
    width: 16px; height: 16px; flex: none;
    border: 1.5px solid var(--ink-3); background: var(--card-solid);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 900; line-height: 1; color: transparent;
  }

  .mark.box { border-radius: 5px; }
  .mark.dot { border-radius: 50%; }

  .opt[aria-pressed="true"] .mark {
    border-color: var(--ink); background: var(--yellow); color: var(--ink);
  }

  .other-note { margin-top: 8px; }

  /* ---------- сноска ---------- */
  .foot { color: var(--ink-3); font-size: 12.5px; text-align: center; }

  /* ---------- печать: та же вёрстка, ужатая под A4 ---------- */
  @media print {
    @page { size: A4; margin: 9mm; }

    body {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      background-attachment: initial;
    }

    /* Держим экранную ширину и масштабируем целиком, иначе на ширине листа
       сработали бы мобильные правила и вёрстка стала бы другой. */
    .wrap { width: 900px; max-width: none; zoom: 0.82; padding: 0 0 8px; gap: 14px; }

    .btn { display: none !important; }

    .card { border-radius: 22px; }
    .field, .card > h2 { break-inside: avoid; page-break-inside: avoid; }
    .card > h2 { break-after: avoid; page-break-after: avoid; }

    /* Пустые поля должны читаться как место для заполнения от руки. */
    input[type="text"], textarea { background: #FFFFFF; }
    textarea { min-height: 0; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <h1 id="title">Передача проекта <em>в комплектацию</em></h1>
    <p class="lede" id="lede"></p>
    <button type="button" class="btn" id="btn-pdf">Скачать PDF</button>
  </header>

  <div id="form"></div>

  <p class="foot" id="foot"></p>
</div>

<script>
let schema = null;
const state = {};

// ---------- сборка формы из описания ----------
function fieldNode(field) {
  const wrap = document.createElement("div");
  wrap.className = "field";

  const hint = field.hint ? " <span class='hint'>— " + field.hint + "</span>" : "";

  if (field.type === "text" || field.type === "textarea") {
    const id = "f-" + field.id;
    const label = document.createElement("label");
    label.setAttribute("for", id);
    label.innerHTML = field.label + hint;
    wrap.appendChild(label);

    const input = document.createElement(field.type === "textarea" ? "textarea" : "input");
    if (field.type === "text") input.type = "text";
    input.id = id;
    input.value = state[field.id] || "";
    input.addEventListener("input", function () {
      state[field.id] = input.value;
      if (field.type === "textarea") grow(input);
    });
    wrap.appendChild(input);
    if (field.type === "textarea") requestAnimationFrame(function () { grow(input); });
    return wrap;
  }

  const legend = document.createElement("span");
  legend.className = "glabel";
  legend.innerHTML = field.label + hint;
  wrap.appendChild(legend);

  const options = document.createElement("div");
  options.className = "options";
  options.setAttribute("role", "group");
  options.setAttribute("aria-label", field.label);

  const multi = field.type === "multi";
  const list = field.other ? field.options.concat(["другой вариант"]) : field.options;

  for (const option of list) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "opt";
    button.setAttribute("aria-pressed", String(isPicked(field, option)));

    const mark = document.createElement("span");
    mark.className = "mark " + (multi ? "box" : "dot");
    mark.textContent = multi ? "✓" : "●";
    button.appendChild(mark);
    button.appendChild(document.createTextNode(option));

    button.addEventListener("click", function () {
      pick(field, option);
      render();
    });

    options.appendChild(button);
  }

  wrap.appendChild(options);

  // «Другой вариант» без поля для текста бесполезен — открываем строку.
  if (field.other && isPicked(field, "другой вариант")) {
    const note = document.createElement("input");
    note.type = "text";
    note.className = "other-note";
    note.placeholder = "Что именно";
    note.value = state[field.id + "Other"] || "";
    note.addEventListener("input", function () { state[field.id + "Other"] = note.value; });
    wrap.appendChild(note);
  }

  return wrap;
}

function isPicked(field, option) {
  const value = state[field.id];
  if (field.type === "multi") return Array.isArray(value) && value.indexOf(option) !== -1;
  return value === option;
}

function pick(field, option) {
  if (field.type !== "multi") {
    state[field.id] = state[field.id] === option ? null : option;   // повторный клик снимает выбор
    return;
  }

  const current = Array.isArray(state[field.id]) ? state[field.id].slice() : [];
  const at = current.indexOf(option);
  if (at === -1) current.push(option);
  else current.splice(at, 1);
  state[field.id] = current;
}

function grow(textarea) {
  textarea.style.height = "auto";
  textarea.style.height = textarea.scrollHeight + 2 + "px";
}

function render() {
  const host = document.getElementById("form");
  const focused = document.activeElement ? document.activeElement.id : null;
  host.innerHTML = "";

  for (const section of schema.sections) {
    const card = document.createElement("section");
    card.className = "card";

    const heading = document.createElement("h2");
    heading.innerHTML = "<span class='ic'>" + section.icon + "</span>";
    heading.appendChild(document.createTextNode(section.title));
    card.appendChild(heading);

    const fields = document.createElement("div");
    fields.className = "fields";
    for (const field of section.fields) fields.appendChild(fieldNode(field));
    card.appendChild(fields);

    host.appendChild(card);
  }

  if (focused) {
    const restored = document.getElementById(focused);
    if (restored) restored.focus();
  }
}

// ---------- печать: состояние приходит в адресе ----------
function applyPrintState() {
  const raw = new URLSearchParams(location.search).get("print");
  if (!raw) return;

  try {
    const bytes = Uint8Array.from(atob(raw), function (c) { return c.charCodeAt(0); });
    Object.assign(state, JSON.parse(new TextDecoder().decode(bytes)));
    document.documentElement.setAttribute("data-theme", "light");
  } catch (err) {
    /* битое состояние — печатаем пустой бланк */
  }
}

async function downloadPdf() {
  const button = document.getElementById("btn-pdf");
  const label = button.textContent;
  button.disabled = true;
  button.textContent = "Готовлю файл…";

  try {
    const res = await fetch("api/report/pdf", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);

    const blob = await res.blob();
    const match = (res.headers.get("Content-Disposition") || "").match(/filename=\"?([^\";]+)/);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = match ? match[1] : "peredacha-v-komplektaciyu.pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (err) {
    button.textContent = "Не получилось: " + err.message;
    setTimeout(function () { button.textContent = label; button.disabled = false; }, 4000);
    return;
  }

  button.textContent = label;
  button.disabled = false;
}

async function boot() {
  try {
    const res = await fetch("form.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    schema = await res.json();
  } catch (err) {
    document.getElementById("form").innerHTML =
      "<section class='card'><p>Не удалось загрузить опросник: " + err.message + "</p></section>";
    return;
  }

  document.getElementById("lede").textContent = schema.lede;
  document.getElementById("foot").textContent = schema.source;
  document.getElementById("btn-pdf").addEventListener("click", downloadPdf);

  applyPrintState();
  render();
}

boot();
</script>
</body>
</html>
